name: Release portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this verified revision to production Firebase Hosting'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get --enforce-lockfile
      - run: npm ci
        working-directory: tooling/firestore
      - name: Configure release credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUMEN_F2E07 }}
        run: |
          python -c "import os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'], 'firebase-credentials.json').write_text(os.environ['FIREBASE_SERVICE_ACCOUNT'])"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-credentials.json" >> "$GITHUB_ENV"
      - name: Prepare public metadata
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://lumen-f2e07.web.app' }}
        run: python scripts/prepare_web.py --site-url "$SITE_URL"
      - run: flutter build web --release --no-pub --dart-define=APP_ENV=production
      - name: Deploy Hosting
        run: tooling/firestore/node_modules/.bin/firebase deploy --project lumen-f2e07 --only hosting --non-interactive
