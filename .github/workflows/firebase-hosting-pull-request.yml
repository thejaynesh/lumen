name: Preview portfolio on staging
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  preview:
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check isolated staging configuration
        id: staging
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_STAGING_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_STAGING_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_STAGING_MESSAGING_SENDER_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_STAGING_AUTH_DOMAIN }}
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          python - <<'PY'
          import json
          import os
          keys = ('FIREBASE_PROJECT_ID', 'FIREBASE_API_KEY', 'FIREBASE_APP_ID',
                  'FIREBASE_MESSAGING_SENDER_ID', 'FIREBASE_AUTH_DOMAIN',
                  'FIREBASE_SERVICE_ACCOUNT_STAGING')
          values = {key: os.environ.get(key, '').strip() for key in keys}
          if not any(values.values()):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('enabled=false\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Staging preview skipped: configure the Firebase web variables and service-account secret in the staging environment to enable previews.\n')
              print('::notice::Staging is not configured. Verification passed; no preview will be published.')
              raise SystemExit(0)
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit('Incomplete staging configuration: ' + ', '.join(missing))
          project = values['FIREBASE_PROJECT_ID']
          if project == 'lumen-f2e07' or project.startswith('demo-'):
              raise SystemExit('Staging must target a separate real Firebase project.')
          try:
              credentials = json.loads(values['FIREBASE_SERVICE_ACCOUNT_STAGING'])
          except ValueError:
              raise SystemExit('The staging service-account secret is not valid JSON.') from None
          if not isinstance(credentials, dict) or credentials.get('type') != 'service_account' or credentials.get('project_id') != project:
              raise SystemExit('Staging credentials must belong to the configured staging project.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=true\n')
          PY
      - uses: subosito/flutter-action@v2
        if: steps.staging.outputs.enabled == 'true'
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Write isolated staging configuration
        if: steps.staging.outputs.enabled == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_STAGING_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_STAGING_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_STAGING_MESSAGING_SENDER_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_STAGING_AUTH_DOMAIN }}
        run: python scripts/write_staging_config.py
      - run: python scripts/prepare_web.py --preview
        if: steps.staging.outputs.enabled == 'true'
      - run: flutter pub get --enforce-lockfile
        if: steps.staging.outputs.enabled == 'true'
      - run: flutter build web --release --no-pub --dart-define-from-file=config/staging.local.json
        if: steps.staging.outputs.enabled == 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.staging.outputs.enabled == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          projectId: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
